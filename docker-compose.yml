services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /run/docker.sock:/run/docker.sock:ro
      - ./config/:/etc/traefik/:ro
      - ./certs/:/letsencrypt/:rw
      - ./logs/:/var/log/traefik/:rw

    networks:
      - web

    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

networks:
  web:
    name: web
    external: true